name: Build Packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build DEB and RPM Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          cd web
          npm ci || npm install
          npm run build
          cd ..

      - name: Build Go Server and Agent Binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/fw-server ./cmd/fw-server
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/fw-agent ./cmd/fw-agent

      - name: Setup NFPM
        uses: goreleaser/nfpm@v2
        with:
          version: latest

      - name: Package DEB and RPM
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm-agent.yaml --packager deb --target dist/
          nfpm package --config packaging/nfpm-agent.yaml --packager rpm --target dist/
          nfpm package --config packaging/nfpm-server.yaml --packager deb --target dist/
          nfpm package --config packaging/nfpm-server.yaml --packager rpm --target dist/
          cd dist && sha256sum * > SHA256SUMS

      - name: Upload Packages as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-firewall-manager-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Release to GitHub (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
